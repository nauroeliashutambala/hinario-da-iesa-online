<!-- Fim Botão Flutuante -->
   <script>
    const headerTitle = document.querySelector(".header h1");
    const hinoContent = document.querySelector(".hino-content");

    // ----------------------------
    // 1. Tenta obter dados do sessionStorage
    // ----------------------------
    const hinoSelecionado = sessionStorage.getItem("hinoSelecionado");
    const idiomaSelecionado = sessionStorage.getItem("idiomaSelecionado");

    // Se existir, converte o hino para objeto
    const hino = hinoSelecionado ? JSON.parse(hinoSelecionado) : null;
    const idioma = idiomaSelecionado || "portugues";

    // ----------------------------
    // 2. Função para renderizar o hino na tela
    // ----------------------------
    function renderHino(hinoData) {
        if (!hinoData) {
            hinoContent.innerHTML = `<p>Hino não encontrado.</p>`;
            return;
        }

        headerTitle.textContent = `${hinoData.id} - ${hinoData.titulo || hinoData.title}`;
        hinoContent.innerHTML = "";

        const versos = (hinoData.hino || "").split(/\n\n/);
        versos.forEach(texto => {
            const versoDiv = document.createElement("div");
            versoDiv.className = "verso";

            const p = document.createElement("p");
            p.textContent = texto.trim();

            versoDiv.appendChild(p);
            hinoContent.appendChild(versoDiv);
        });
    }

    // ----------------------------
    // 3. Se tiver hino no sessionStorage → renderiza direto
    // Caso contrário, tenta buscar da URL (?lang=&id=)
    // ----------------------------
    if (hino) {
        renderHino(hino);
    } else {
        // Tenta pegar os parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const idiomaURL = urlParams.get("lang") || idioma;
        const hinoId = urlParams.get("id");

        if (!hinoId) {
            hinoContent.innerHTML = `<p>Nenhum hino selecionado.</p>`;
        } else {
            const jsonUrl = `db/${idiomaURL}.json`;
            fetch(jsonUrl)
                .then(res => res.json())
                .then(data => {
                    const hinoData = data.find(item => String(item.id) === String(hinoId));
                    renderHino(hinoData);
                })
                .catch(err => {
                    console.error(err);
                    hinoContent.innerHTML = `<p>Erro ao carregar o hino.</p>`;
                });
        }
    }
</script>
