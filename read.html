<script>
    // ----------------------------
    // 1. Pegar idioma e id da URL
    // ----------------------------
    const pathParts = window.location.pathname.split("/");
    const idioma = pathParts[2] || "portugues"; // ex: umbundu
    const hinoId = parseInt(pathParts[3], 10);  // ex: 4

    const jsonUrl = `https://hinario-iesa-online.wuaze.com/db/${idioma}.json`;

    const headerTitle = document.querySelector(".header h1");
    const hinoContent = document.querySelector(".hino-content");

    // ----------------------------
    // 2. Carregar JSON do idioma
    // ----------------------------
    async function loadHino() {
        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error("Erro ao carregar JSON");

            const data = await response.json();
            const hino = data.find(item => parseInt(item.id, 10) === hinoId);

            if (!hino) {
                hinoContent.innerHTML = `<p>Hino não encontrado.</p>`;
                return;
            }

            // Atualiza título
            headerTitle.textContent = `${hino.id} - ${hino.titulo || hino.title}`;

            // Renderiza conteúdo do hino (suporta versos com \n\n)
            hinoContent.innerHTML = "";
            const versos = (hino.hino || "").split(/\n\n/);

            versos.forEach((texto, index) => {
                const versoDiv = document.createElement("div");
                versoDiv.className = "verso";

                const numero = document.createElement("div");
                numero.className = "verso-number";
                numero.textContent = ``;

                const p = document.createElement("p");
                p.textContent = texto.trim();

                versoDiv.appendChild(numero);
                versoDiv.appendChild(p);
                hinoContent.appendChild(versoDiv);
            });

        } catch (error) {
            console.error(error);
            hinoContent.innerHTML = `<p>Erro ao carregar o hino.</p>`;
        }
    }

    loadHino();
</script>
