	<body>
		<nav>

<script>
		// Função para carregar dados salvos
function loadSavedLesson() {
    // Tentar carregar de várias fontes
    let savedData = localStorage.getItem('selectedLesson') || 
                   sessionStorage.getItem('selectedLesson') || 
                   getCookie('selectedLesson');

    if (savedData) {
        try {
            const lesson = JSON.parse(savedData);
            processLessonData(lesson);
            
            // Limpar dados após processamento
            clearSavedData();
            
        } catch (error) {
            console.error('Erro ao processar dados salvos:', error);
            loadDefaultLesson();
        }
    } else {
        loadDefaultLesson();
    }
}

// Função para obter cookie
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
    return null;
}

// Função para limpar dados salvos
function clearSavedData() {
    localStorage.removeItem('selectedLesson');
    sessionStorage.removeItem('selectedLesson');
    document.cookie = 'selectedLesson=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
    console.log('Dados salvos foram limpos');
}

// Função para processar os dados da lição
function processLessonData(lessonData) {
    console.log('Processando lição:', lessonData);
    
    // Definir idioma padrão (0 = Português, 1 = Umbundo)
    let currentLang = 0;
    
    // Funções simplificadas
    function setTextTo(classe, texto) {
        const element = document.querySelector(classe);
        if (element) element.innerHTML = texto;
    }

    function setTextToElement(classe, texto) {
        const element = document.querySelector(classe);
        if (element) element.innerHTML = texto;
    }

    function setNewTitle(title) {
        document.querySelector("title").innerHTML = title;
    }

    function setLicao(licao) {
        setTextTo(".licao", licao);
    }

    function setCapitulo(capitulo) {
        setTextTo(".capitulo", capitulo);
    }

    function setOracao(oracao) {
        setTextTo(".oracao", oracao);
    }

    function setLeitura(texto, leitura) {
        setTextTo(".leitura", `<b class="textos">${texto}: </b>${leitura}`);
    }

    function setPergunta(texto, pergunta) {
        setTextTo(".pergunta", `<b class="textos">${texto}: </b>${pergunta}`);
    }

    function setResposta(texto, resposta) {
        setTextTo(".resposta", `<b class="textos">${texto}: </b>${resposta}`);
    }

    function setTexto(texto) {
        setTextTo(".texto", texto);
    }

    function setCitacao(citacoes) {
        const citacaoElement = document.querySelector(".citacao");
        if (citacaoElement) citacaoElement.innerHTML += citacoes + "<br>";
    }

    function limpaCitacoes() {
        const citacaoElement = document.querySelector(".citacao");
        if (citacaoElement) citacaoElement.innerHTML = "";
    }

    function setNewElement(lista) {
        const ulElement = document.querySelector("ul");
        if (ulElement) ulElement.innerHTML += `<li>${lista}</li>`;
    }

    function limpaLista() {
        const ulElement = document.querySelector("ul");
        if (ulElement) ulElement.innerHTML = "";
    }

    // Funções de idioma
    function listaUM() {
        limpaCitacoes();
        limpaLista();
        
        setNewTitle(lessonData.titulo[1]);
        setPergunta("Epulilo", lessonData.pergunta[1]);
        setResposta("Ekumululo", lessonData.resposta[1]);
        setLeitura("Tanga", lessonData.leitura[1]);
        setTexto(lessonData.texto[1]);
        setLicao(lessonData.licao[1]);
        setOracao(lessonData.oracao[1]);
        setCapitulo("Ocilae " + lessonData.capitulo);
        
        if (lessonData.explicacaoUm) {
            lessonData.explicacaoUm.forEach((texto) => {
                setNewElement(texto);
            });
        }
        
        if (lessonData.extras) {
            lessonData.extras.forEach((texto) => {
                setCitacao(texto);
            });
        }
    }

    function listaPT() {
        limpaCitacoes();
        limpaLista();
        
        setNewTitle(lessonData.titulo[0]);
        setPergunta("Pergunta", lessonData.pergunta[0]);
        setResposta("Resposta", lessonData.resposta[0]);
        setLeitura("Leitura", lessonData.leitura[0]);
        setTexto(lessonData.texto[0]);
        setLicao(lessonData.licao[0]);
        setOracao(lessonData.oracao[0]);
        setCapitulo("Capítulo " + lessonData.capitulo);
        
        if (lessonData.explicacaoPt) {
            lessonData.explicacaoPt.forEach((texto) => {
                setNewElement(texto);
            });
        }
        
        if (lessonData.extras) {
            lessonData.extras.forEach((texto) => {
                setCitacao(texto);
            });
        }
    }

    // Configurar botões de idioma
    function setupLanguageButtons() {
        let btns = document.querySelectorAll("button");
        
        btns.forEach((btn) => {
            btn.addEventListener("click", () => {
                for (let i = 0; i < btns.length; i++) {
                    btns[i].classList.remove("active");
                }
                btn.classList.toggle("active");
                
                // Determinar qual idioma foi selecionado
                if (btn.textContent.includes("Umbundo") || btn.textContent.includes("UM")) {
                    currentLang = 1;
                    listaUM();
                } else {
                    currentLang = 0;
                    listaPT();
                }
            });
        });
    }

    // Inicializar com Português
    listaPT();
    setupLanguageButtons();
}

// Inicializar quando a página carregar
document.addEventListener('DOMContentLoaded', function() {
    loadSavedLesson();
});

// Adicionar função para debug (opcional)
window.checkSavedData = function() {

                 sessionStorage.getItem('selectedLesson') ||

		</script>
