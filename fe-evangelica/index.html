<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro de Lições Bíblicas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            opacity: 0.95;
            font-size: 1.2em;
            font-weight: 300;
        }

        .language-selector {
            background: #fffaf0;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #ffe0b2;
        }

        .language-selector h2 {
            color: #e67e22;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 1.4em;
        }

        .language-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .lang-btn {
            padding: 15px 30px;
            border: 2px solid #e67e22;
            background: white;
            color: #e67e22;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .lang-btn:hover {
            background: #e67e22;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.3);
        }

        .lang-btn.active {
            background: #e67e22;
            color: white;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        .content-section {
            padding: 30px;
        }

        .chapters-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .chapter-card {
            background: #fffaf0;
            border: 2px solid #ffb74d;
            border-radius: 15px;
            padding: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .chapter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(230, 126, 34, 0.2);
            border-color: #e67e22;
        }

        .chapter-header {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chapter-header:hover {
            background: linear-gradient(135deg, #f57c00, #e65100);
        }

        .chapter-title {
            font-size: 1.5em;
            font-weight: 600;
        }

        .chapter-number {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .lessons-container {
            padding: 25px;
            background: white;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .lesson-card {
            background: #fff8e1;
            border: 1px solid #ffd54f;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .lesson-card:hover {
            background: #ffecb3;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 167, 38, 0.2);
            border-color: #ffa726;
        }

        .lesson-number {
            font-weight: 700;
            color: #e67e22;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .lesson-title {
            color: #5d4037;
            font-size: 1em;
            line-height: 1.4;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #e67e22;
            font-size: 1.3em;
            background: #fffaf0;
            border-radius: 15px;
            margin: 20px;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #d84315;
            background: #ffebee;
            margin: 20px;
            border-radius: 15px;
            border: 2px solid #ffcdd2;
            font-size: 1.1em;
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }
.lesson-card {
    background: #fff8e1;
    border: 1px solid #ffd54f;
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.lesson-card::after {
    content: '🔍 Ler';
    position: absolute;
    top: 10px;
    right: 10px;
    background: #e67e22;
    color: white;
    padding: 4px 8px;
    border-radius: 15px;
    font-size: 0.8em;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.lesson-card:hover::after {
    opacity: 1;
}

.lesson-card:hover {
    background: #ffecb3;
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(255, 167, 38, 0.2);
    border-color: #ffa726;
}

.lesson-preview {
    margin-top: 10px;
    font-size: 0.9em;
    color: #666;
    font-style: italic;
}
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .language-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .lang-btn {
                width: 100%;
                max-width: 250px;
            }
            
            .lessons-grid {
                grid-template-columns: 1fr;
            }
            
            .chapter-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 Livro de Lições Bíblicas</h1>
            <p>Estudo Bíblico em Português e Umbundo</p>
        </div>

        <div class="language-selector">
            <h2>🌍 Escolha o Idioma</h2>
            <div class="language-buttons">
                <button class="lang-btn active" data-lang="0">Português 🇧🇷</button>
                <button class="lang-btn" data-lang="1">Umbundo 🇦🇴</button>
            </div>
        </div>

        <div class="content-section fade-in" id="contentSection">
            <div class="loading" id="loading">
                <div>📚 Carregando lições...</div>
            </div>
            <div class="error hidden" id="error">
                ❌ Erro ao carregar as lições. Verifique se o arquivo JSON está disponível.
            </div>
            <div class="chapters-container hidden" id="chaptersContainer">
                <!-- Capítulos serão inseridos aqui pelo JavaScript -->
            </div>
        </div>
    </div>

    <script>
       // Variáveis globais
let currentLanguage = 0; // 0 = Português, 1 = Umbundo
let allLessons = [];
let groupedChapters = {};

// Elementos DOM
const chaptersContainer = document.getElementById('chaptersContainer');
const loadingElement = document.getElementById('loading');
const errorElement = document.getElementById('error');
const langButtons = document.querySelectorAll('.lang-btn');

// Função para salvar a lição selecionada
function saveSelectedLesson(lessonObject) {
    // Salvar no localStorage
    localStorage.setItem('selectedLesson', JSON.stringify(lessonObject));
    
    // Também salvar em sessionStorage como backup
    sessionStorage.setItem('selectedLesson', JSON.stringify(lessonObject));
    
    // Salvar em cookie (para compatibilidade extra)
    document.cookie = `selectedLesson=${encodeURIComponent(JSON.stringify(lessonObject))}; path=/; max-age=3600`; // 1 hora
    
    console.log('Lição salva:', lessonObject);
}

// Função para redirecionar para a página de leitura
function redirectToReadPage() {
    // Verificar se há uma lição salva
    const savedLesson = localStorage.getItem('selectedLesson');
    if (!savedLesson) {
        alert('Nenhuma lição selecionada!');
        return;
    }
    
    // Redirecionar para a página read
    window.location.href = 'read/';
}

// Função para carregar o JSON
async function loadLessons() {
    try {
        loadingElement.classList.remove('hidden');
        errorElement.classList.add('hidden');
        chaptersContainer.classList.add('hidden');

        const response = await fetch('licoes.json');
        
        if (!response.ok) {
            throw new Error('Erro ao carregar o arquivo JSON');
        }
        
        allLessons = await response.json();
        groupLessonsByChapter();
        renderChapters();
        
        loadingElement.classList.add('hidden');
        chaptersContainer.classList.remove('hidden');
        
    } catch (error) {
        console.error('Erro:', error);
        loadingElement.classList.add('hidden');
        errorElement.classList.remove('hidden');
    }
}

// Agrupar lições por capítulo
function groupLessonsByChapter() {
    groupedChapters = {};
    
    allLessons.forEach(lesson => {
        const chapterNum = lesson.capitulo;
        
        if (!groupedChapters[chapterNum]) {
            groupedChapters[chapterNum] = {
                capitulo: chapterNum,
                titulo: lesson.titulo,
                licoes: []
            };
        }
        
        // Adicionar o objeto completo da lição para ter todos os dados
        groupedChapters[chapterNum].licoes.push(lesson);
    });
}

// Renderizar capítulos
function renderChapters() {
    chaptersContainer.innerHTML = '';
    
    const chapters = Object.values(groupedChapters).sort((a, b) => a.capitulo - b.capitulo);
    
    chapters.forEach(chapter => {
        const chapterCard = document.createElement('div');
        chapterCard.className = 'chapter-card fade-in';
        chapterCard.innerHTML = `
            <div class="chapter-header">
                <div class="chapter-title">${chapter.titulo[currentLanguage]}</div>
                <div class="chapter-number">Capítulo ${chapter.capitulo}</div>
            </div>
            <div class="lessons-container">
                <div class="lessons-grid">
                    ${chapter.licoes.map(lesson => `
                        <div class="lesson-card" data-lesson='${JSON.stringify(lesson).replace(/'/g, "&#39;")}'>
                            <div class="lesson-number">${lesson.licao[currentLanguage]}</div>
                            <div class="lesson-title">${lesson.titulo[currentLanguage]}</div>
                            <div class="lesson-preview" style="margin-top: 10px; font-size: 0.9em; color: #666;">
                                Clique para ler esta lição
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        
        // Adicionar event listeners para cada card de lição
        chapterCard.querySelectorAll('.lesson-card').forEach(card => {
            card.addEventListener('click', function() {
                const lessonData = JSON.parse(this.dataset.lesson);
                
                // Salvar a lição selecionada
                saveSelectedLesson(lessonData);
                
                // Feedback visual
                this.style.background = '#ff9800';
                this.style.color = 'white';
                this.style.transform = 'scale(0.98)';
                
                setTimeout(() => {
                    this.style.background = '';
                    this.style.color = '';
                    this.style.transform = '';
                    
                    // Redirecionar após o feedback visual
                    redirectToReadPage();
                }, 300);
            });
            
            // Efeito hover melhorado
            card.addEventListener('mouseenter', function() {
                this.style.cursor = 'pointer';
                this.style.boxShadow = '0 8px 25px rgba(230, 126, 34, 0.4)';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.boxShadow = '';
            });
        });
        
        chaptersContainer.appendChild(chapterCard);
    });
}

// Atualizar idioma
function updateLanguage(langIndex) {
    currentLanguage = langIndex;
    renderChapters();
    
    // Atualizar botões de idioma
    langButtons.forEach((btn, index) => {
        if (index === langIndex) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

// Event Listeners
langButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        const langIndex = parseInt(btn.dataset.lang);
        updateLanguage(langIndex);
    });
});

// Função para verificar se há lição salva (útil para debug)
function checkSavedLesson() {
    const saved = localStorage.getItem('selectedLesson');
    if (saved) {
        console.log('Lição atualmente salva:', JSON.parse(saved));
    } else {
        console.log('Nenhuma lição salva no momento');
    }
}

// Inicializar
loadLessons();

// Expor funções globalmente para debug (opcional)
window.checkSavedLesson = checkSavedLesson;
window.clearSavedLesson = function() {
    localStorage.removeItem('selectedLesson');
    sessionStorage.removeItem('selectedLesson');
    document.cookie = 'selectedLesson=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
    console.log('Lição salva foi limpa');
};
    </script>
</body>
</html>
