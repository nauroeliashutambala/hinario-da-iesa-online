<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hinário - Geral</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      line-height: 1.6;
      padding: 0;
    }

    .header {
      display: flex;
      align-items: center;
      background-color: #ff6600;
      color: white;
      padding: 10px 15px;
      font-size: 1.2em;
    }

    .header a {
      color: white;
      text-decoration: none;
      margin-right: 15px;
      font-size: 22px;
    }

    .tab-menu {
      display: flex;
      border-bottom: 2px solid #ccc;
      background-color: white;
    }

    .tab-button {
      flex-grow: 1;
      text-align: center;
      padding: 10px 0;
      cursor: pointer;
      font-weight: bold;
      color: #777;
      transition: color 0.3s;
      position: relative;
    }

    .tab-button.active {
      color: #ff6600;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #ff6600;
    }

    .tab-content {
      padding: 20px;
    }

    .content-pane {
      display: none;
    }

    .content-pane.active {
      display: block;
    }

    .minister,
    .congregation {
      margin-bottom: 1.5em;
    }

    .minister strong,
    .congregation strong {
      font-weight: bold;
      display: inline;
    }

    #chat-float-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      background: #ff5722;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #chat-float-btn:hover {
      background: #e64a19;
    }
  </style>
</head>

<body>
  <div class="header">
    <a href="home.html" title="Voltar para a página inicial"><i class="fas fa-arrow-left"></i></a>
    <span id="titulo-header">Carregando...</span>
  </div>

  <div class="tab-menu">
    <div class="tab-button active" data-tab="portugues">Português</div>
    <div class="tab-button" data-tab="umbundu">Umbundu</div>
  </div>

  <div class="tab-content">
    <div id="portugues" class="content-pane active"></div>
    <div id="umbundu" class="content-pane"></div>
  </div>

  <a href="/hinario/chat" id="chat-float-btn" title="Falar com a IA">
    <i class="fas fa-comments"></i>
  </a>

  <script>
    // Lê o nome do arquivo pela URL (ex: geral.html?file=suplica)
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || 'chamada'; // padrão: chamada.json
    const path = `hinario-da-iesa-online/db/geral/${file}.json`;

    // Carrega o arquivo JSON
    fetch(path)
      .then(response => {
        if (!response.ok) throw new Error("Arquivo não encontrado.");
        return response.json();
      })
      .then(data => {
        // Atualiza o título
        document.getElementById("titulo-header").textContent = data.titulo_pt || "Hinário";

        // Converte markdown simples (### Congregação / Ministro)
        function markdownToHTML(text) {
          return text
            .replace(/###\s*Congregação:/g, '<div class="congregation"><strong>Congregação:</strong>')
            .replace(/###\s*Ekongelo:/g, '<div class="congregation"><strong>Ekongelo:</strong>')
            .replace(/Ministro:/g, '<div class="minister"><strong>Ministro:</strong>')
            .replace(/Usongi:/g, '<div class="minister"><strong>Usongi:</strong>')
            .replace(/\n\s*\n/g, '</div><br>') + '</div>';
        }

        document.getElementById("portugues").innerHTML = markdownToHTML(data.texto_pt || "");
        document.getElementById("umbundu").innerHTML = markdownToHTML(data.texto_um || "");
      })
      .catch(err => {
        document.getElementById("portugues").innerHTML = `<p style="color:red;">Erro ao carregar: ${err.message}</p>`;
      });

    // Alterna as abas
    const tabs = document.querySelectorAll(".tab-button");
    const panes = document.querySelectorAll(".content-pane");
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const target = tab.getAttribute("data-tab");
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        panes.forEach(p => p.classList.remove("active"));
        document.getElementById(target).classList.add("active");
      });
    });
  </script>
</body>

</html>
