<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat com IA - IESA Assistente</title>
  <style>
    :root {
      --laranja: #ff7a00;
      --laranja-escuro: #e06700;
      --cinza: #f2f2f2;
      --texto: #333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Roboto", Arial, sans-serif;
      background: var(--cinza);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    header {
      background: var(--laranja);
      width: 100%;
      text-align: center;
      padding: 15px 0;
      color: white;
      font-size: 22px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    #chat-container {
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      padding: 15px;
      height: 70vh;
      overflow-y: auto;
      margin-top: 20px;
    }

    .message {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 75%;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 15px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .user {
      background: var(--laranja);
      color: white;
      align-self: flex-end;
    }

    .bot {
      background: #f8f8f8;
      color: var(--texto);
      border: 1px solid #eee;
      align-self: flex-start;
    }

    #input-area {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #prompt {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    #prompt:focus {
      border-color: var(--laranja);
    }

    #send {
      background: var(--laranja);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    #send:hover {
      background: var(--laranja-escuro);
      transform: scale(1.03);
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>💬 Chat com IA - IESA Assistente</header>

  <div id="chat-container"></div>

  <div id="input-area">
    <input type="text" id="prompt" placeholder="Digite sua mensagem..." />
    <button id="send">Enviar</button>
  </div>

  <p id="status"></p>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const statusText = document.getElementById("status");

    // Função para adicionar mensagens
    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = "message " + sender;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      addMessage(prompt, "user");
      promptInput.value = "";
      statusText.innerText = "Aguardando resposta da IA...";

      try {
        const proxy = "https://corsproxy.io/?";
        const apiURL = "https://us-central1-conquer-apps-2ad61.cloudfunctions.net/prod/api.live";
        const url = proxy + encodeURIComponent(apiURL);

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            n: 1,
            prompt: prompt,
            temperature: 0.7,
            top_p: 1,
          }),
        });

        if (!response.ok) throw new Error("Erro ao conectar à API");

        const data = await response.json();
        const content =
          data?.choices?.[0]?.message?.content || "Sem resposta da IA.";

        addMessage(content, "bot");
        statusText.innerText = "";
      } catch (error) {
        console.error("Erro:", error);
        statusText.innerText = "⚠️ Erro: " + error.message;
        addMessage("Desculpe, não consegui conectar à IA.", "bot");
      }
    }

    sendButton.addEventListener("click", sendMessage);
    promptInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
