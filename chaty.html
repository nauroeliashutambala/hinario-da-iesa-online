<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat IESA</title>
  <meta name="description" content="Chat online do Hinário da IESA para dúvidas e interação.">
  <meta name="keywords" content="chat, hinário, IESA, Angola, gospel, dúvidas, conversa">
  <meta name="author" content="Nauro Elias Hutambala">
  <meta name="robots" content="index, follow">
  <meta name="language" content="pt-BR">
  <meta name="theme-color" content="#ff5722">
  <meta property="og:title" content="Chat IESA">
  <meta property="og:description" content="Chat online do Hinário da IESA para dúvidas e interação.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hinario-iesa-online.wuaze.com/chaty">
  <meta property="og:image" content="https://hinario-iesa-online.wuaze.com/assets/img/capa-hinario.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chat IESA">
  <meta name="twitter:description" content="Chat online do Hinário da IESA para dúvidas e interação.">
  <meta name="twitter:image" content="https://hinario-iesa-online.wuaze.com/assets/img/capa-hinario.jpg">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; }
    .chat-container { max-width: 400px; margin: 60px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; }
    .chat-title { font-size: 1.3em; color: #ff5722; margin-bottom: 16px; text-align: center; }
    .chat-messages { min-height: 180px; max-height: 300px; overflow-y: auto; background: #f4f4f4; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .msg { margin-bottom: 10px; }
    .msg.user { text-align: right; color: #1976d2; }
    .msg.bot { text-align: left; color: #333; }
    .chat-input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; margin-top: 12px; }
    .chat-btn { background: #ff5722; color: #fff; border: none; border-radius: 4px; padding: 8px 16px; margin-top: 8px; cursor: pointer; }
    .chat-btn:hover { background: #e64a19; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-title"><i class="fas fa-comments"></i> Chat IESA</div>
    <div class="chat-messages" id="chat-messages"></div>
    <input type="text" class="chat-input" id="chat-input" placeholder="Digite sua mensagem...">
    <button class="chat-btn" id="chat-send">Enviar</button>
  </div>
  <script>
    const messages = [];
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');

    function renderMessages() {
      chatMessages.innerHTML = '';
      messages.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg ' + m.role;
        div.textContent = (m.role === 'user' ? 'Você: ' : 'IESA: ') + m.content;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatSend.onclick = function() {
      const text = chatInput.value.trim();
      if (!text) return;
      messages.push({ role: 'user', content: text });
      renderMessages();
      chatInput.value = '';
      chatInput.disabled = true;
      chatSend.disabled = true;
      fetch('/chatendpoint', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensagens: messages })
      })
      .then(res => res.json())
      .then(data => {
        messages.push({ role: 'bot', content: data.resposta || 'Erro ao responder.' });
        renderMessages();
      })
      .catch(() => {
        messages.push({ role: 'bot', content: 'Erro de conexão.' });
        renderMessages();
      })
      .finally(() => {
        chatInput.disabled = false;
        chatSend.disabled = false;
        chatInput.focus();
      });
    };
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') chatSend.click();
    });
  </script>
</body>
</html>
