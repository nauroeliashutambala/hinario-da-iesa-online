  let itens_list = [

    // --- Itens seguintes ---
   
    {titulo: "Fê evangelica", img: "heart.png", link: "fe-evangelica"}
  ];


  const sec = document.querySelector("section");

  itens_list.forEach(item => {
    sec.innerHTML += `
      <a href="${item.link}" class="card">
        <img src="assets/img/${item.img}" alt="${item.titulo}">
        <p>${item.titulo}</p>
      </a>
    `;
  });
</script>
