<body>

    <div class="header">
        <span class="back-arrow">&#8592;</span>
        <h1>Hinos</h1>
    </div>

    <div class="list-container" id="list-container">
        </div>

<script>
    const hinosData = [
        { id: 1, name: 'Umbundo', count: 464 },
        { id: 2, name: 'Portugues', count: 231 },
        { id: 3, name: 'Nganguela', count: 34 },
        { id: 4, name: 'Kimbundo', count: 26 },
        { id: 5, name: 'Kikongo', count: 26 },
        { id: 6, name: 'Cokwe', count: 39 },
        { id: 7, name: 'Kwanyama', count: 23 },
        { id: 8, name: 'Nianeka', count: 20 },
        { id: 9, name: 'Fiote', count: 20 },
    ];

    const listContainer = document.getElementById('list-container');

    // Função para transformar nome em slug (minusculas, sem acento, sem espaços)
    function toSlug(text) {
        return text
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "") // remove acentos
            .toLowerCase()
            .replace(/\s+/g, "");            // remove espaços
    }

    hinosData.forEach(item => {
        const listItem = document.createElement('div');
        listItem.className = 'list-item';

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = `${item.id} - ${item.name}`;

        const subtitle = document.createElement('div');
        subtitle.className = 'subtitle';
        subtitle.textContent = `${item.count} hinos`;

        listItem.appendChild(title);
        listItem.appendChild(subtitle);

        // Evento de clique -> redireciona para rota amigável
        listItem.addEventListener("click", () => {
            const idiomaSlug = toSlug(item.name);
            window.location.href = `hinos.html?lang=${idiomaSlug}`;
        });

        listContainer.appendChild(listItem);
    });
</script>
